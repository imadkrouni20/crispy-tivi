name: Code Quality
on:
  workflow_dispatch:
env:
  RGUARD_REV: "50aa1c13b9c85c7af3b76d05e6a610194e9367be"
  SEMGREP_VERSION: "1.136.0"
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned rice-guard and Semgrep
        run: |
          cargo install --git https://github.com/moabualruz/rice-guard --rev "$RGUARD_REV" --locked --bin rguard --root "$RUNNER_TEMP/rguard"
          echo "$RUNNER_TEMP/rguard/bin" >> "$GITHUB_PATH"
          python -m pip install "semgrep==$SEMGREP_VERSION"
          echo "SEMGREP_BINARY=$(command -v semgrep)" >> "$GITHUB_ENV"
          echo "SEMGREP_LOG_PATH=$RUNNER_TEMP/semgrep-stderr.log" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/semgrep-wrapper"
          cat > "$RUNNER_TEMP/semgrep-wrapper/semgrep" <<'SH'
          #!/bin/sh
          exec python3 "$GITHUB_WORKSPACE/.github/semgrep-with-log.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/semgrep-wrapper/semgrep"
          echo "$RUNNER_TEMP/semgrep-wrapper" >> "$GITHUB_PATH"
      - name: Verify rice-guard installation
        run: rguard --version && semgrep --version
      - name: Scan
        run: python3 scripts/ci/rguard_scan_gate.py
        env:
          RICE_GUARD_FAIL_ON: high
      - name: Preserve scanner diagnostics
        if: always()
        run: |
          if [ -f "$SEMGREP_LOG_PATH" ]; then
            mkdir -p reports/crispy-tivi/scanner-logs
            cp "$SEMGREP_LOG_PATH" reports/crispy-tivi/scanner-logs/semgrep-stderr.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rguard-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/crispy-tivi/
          if-no-files-found: warn
          retention-days: 14
