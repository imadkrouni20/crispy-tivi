# Branch Protection Required Checks:
#   - rust-test, flutter-analyze, flutter-test (Tier 0)
#   - build-windows, build-android, build-web, playwright-web, golden-tests, build-server (Tier 1)
#
# Tier 2 (advisory, non-blocking): build-macos, build-ios, build-linux

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.1"
  RUST_VERSION: "1.91.1"
  ALPHA_BASE: "0.1.0-alpha"
  RGUARD_REV: "50aa1c13b9c85c7af3b76d05e6a610194e9367be"
  SEMGREP_VERSION: "1.136.0"
  # ── Test count thresholds ────────────────────────
  # Minimum number of passing tests required.
  # CI fails if counts drop below these values.
  # UPDATE these when adding new tests:
  #   1. Run the test suite locally to get current count
  #   2. Set threshold ~5-10% below actual count
  #   3. Commit the updated threshold
  RUST_TEST_THRESHOLD: 1195 # actual ~1258 as of 2026-03-13
  FLUTTER_TEST_THRESHOLD: 3120 # actual ~3285 as of 2026-03-13

jobs:
  # Prepare the source once before independent platform jobs fan out.
  prepare-pr-worktree:
    name: Prepare CI Source
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify runner workflow contract
        run: |
          python3 .github/test-runner-worktree-contract.py
          python3 .github/test-rguard-scan-gate.py
      - name: Verify PR checkout matches workflow SHA
        if: github.event_name == 'pull_request'
        run: test "$(realpath "$GITHUB_WORKSPACE")" = "$(git rev-parse --show-toplevel)" && test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare Flutter dependencies in the shared worktree
        run: cd app/flutter && flutter pub get
      - name: Archive prepared source at workflow SHA
        run: |
          source="$RUNNER_TEMP/source-tree"
          mkdir -p "$source"
          git archive "$GITHUB_SHA" | tar -x -C "$source"
          # shellcheck disable=SC2016
          git submodule foreach --recursive '
            destination="$RUNNER_TEMP/source-tree/$displaypath"
            mkdir -p "$destination"
            git archive HEAD | tar -x -C "$destination"
          '
          cp -a .git "$source/.git"
          tar -czf "$RUNNER_TEMP/source.tar.gz" -C "$source" .
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source.tar.gz
          if-no-files-found: error
          retention-days: 1

  quality:
    name: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [prepare-pr-worktree]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rice-guard and Semgrep
        run: |
          cargo install --git https://github.com/moabualruz/rice-guard --rev "$RGUARD_REV" --locked --bin rguard --root "$RUNNER_TEMP/rguard"
          echo "$RUNNER_TEMP/rguard/bin" >> "$GITHUB_PATH"
          python -m pip install "semgrep==$SEMGREP_VERSION"
      - name: Verify rice-guard installation
        run: rguard --version
      - name: Scan
        run: python3 scripts/ci/rguard_scan_gate.py
        env:
          RICE_GUARD_FAIL_ON: high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rguard-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/crispy-tivi/
          if-no-files-found: warn
          retention-days: 14

  # =================================================================
  # === TIER 0: Fast Gates (always required, run first) =============
  # =================================================================

  # ── Rust Tests ──────────────────────────────────
  rust-test:
    name: Rust Tests
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    needs: [prepare-pr-worktree]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install Linux Rust build dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          prefix-key: v2
      - name: cargo fmt check
        run: cargo fmt --check -p crispy-core -p crispy-ffi -p crispy-server
        working-directory: rust
      - name: cargo test (threshold-enforced)
        run: |
          set +e
          output=$(dbus-run-session -- bash -e -c 'printf "ci-test-keyring\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; cargo test --workspace' 2>&1)
          exit_code=$?
          set -e
          echo "$output"

          if [ $exit_code -ne 0 ]; then
            echo "::error::cargo test failed with exit code $exit_code"
            exit $exit_code
          fi

          count=$(echo "$output" | grep -oE "[0-9]+ passed" | grep -oE "[0-9]+")
          total=0
          for c in $count; do
            total=$((total + c))
          done
          count=$total
          echo "Rust tests passed: $count"
          threshold=${{ env.RUST_TEST_THRESHOLD }}
          if [ -z "$count" ] || [ "$count" -lt "$threshold" ]; then
            echo "::error::Rust test count ($count) below minimum threshold ($threshold). See env.RUST_TEST_THRESHOLD in ci.yml."
            exit 1
          fi
        working-directory: rust
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
        working-directory: rust
      - name: Check file sizes
        run: bash scripts/check_file_sizes.sh

  # ── Flutter Analyze ─────────────────────────────
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    needs: [prepare-pr-worktree]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd app/flutter && flutter pub get
      - name: Dart format check
        run: cd app/flutter && dart format --set-exit-if-changed lib/ test/
      - run: bash scripts/ci/flutter_analyze.sh
      - name: Architecture boundary check
        run: cd app/flutter && dart run tool/check_boundary.dart

  # ── Flutter Tests ───────────────────────────────
  flutter-test:
    name: Flutter Tests
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    needs: [prepare-pr-worktree, flutter-analyze]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd app/flutter && flutter pub get
      - name: Run tests with coverage (threshold-enforced)
        run: |
          set +e
          output=$(cd app/flutter && flutter test --coverage test/config/ test/core/ test/features/ 2>&1)
          exit_code=$?
          set -e
          echo "$output"

          if [ $exit_code -ne 0 ]; then
            echo "::error::cd app/flutter && flutter test failed with exit code $exit_code"
            exit $exit_code
          fi

          count=$(echo "$output" | grep -oE "([0-9]+ tests? passed|\+[0-9]+: All tests passed)" | head -1 | grep -oE "[0-9]+")
          if [ -z "$count" ]; then
            count=$(echo "$output" | grep -oP '\+(\d+)' | tail -1 | grep -oP '\d+')
          fi
          echo "Flutter tests passed: $count"
          threshold=${{ env.FLUTTER_TEST_THRESHOLD }}
          if [ -z "$count" ] || [ "$count" -lt "$threshold" ]; then
            echo "::error::Flutter test count ($count) below minimum threshold ($threshold). See env.FLUTTER_TEST_THRESHOLD in ci.yml."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lcov-coverage
          path: app/flutter/coverage/lcov.info
          retention-days: 14

  # =================================================================
  # === TIER 1: Required for Merge ==================================
  # =================================================================

  # ── Golden Tests (visual regression) ────────────
  golden-tests:
    name: Golden Tests
    runs-on: windows-latest
    needs: [prepare-pr-worktree, flutter-analyze]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        shell: pwsh
        run: tar -xzf "$env:RUNNER_TEMP/source/source.tar.gz" -C "$env:GITHUB_WORKSPACE"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd app/flutter && flutter pub get
      - name: Run golden tests
        run: cd app/flutter && flutter test test/golden/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: app/flutter/test/golden/failures/
          retention-days: 14

  # ── Build Windows ───────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [prepare-pr-worktree, rust-test, flutter-analyze]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        shell: pwsh
        run: tar -xzf "$env:RUNNER_TEMP/source/source.tar.gz" -C "$env:GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux Rust build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          prefix-key: v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd app/flutter && flutter pub get
      - run: cd app/flutter && flutter build windows --release
      - name: Run integration tests
        run: |
          cd app/flutter && flutter test integration_test/flows/channel_browse_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/content_switching_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/dvr_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/epg_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/favorites_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/iptv_setup_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/mini_player_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/onboarding_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/player_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/player_speed_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/profile_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/profile_pin_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/search_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/settings_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/vod_flow_test.dart -d windows
          cd app/flutter && flutter test integration_test/flows/vod_resume_flow_test.dart -d windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: app/flutter/build/windows/x64/runner/Release/
          retention-days: 7

  # ── Build Android ───────────────────────────────
  build-android:
    name: Build Android
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    needs: [prepare-pr-worktree, rust-test, flutter-analyze]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          prefix-key: v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;27.0.12077973
      - name: Point cargo-ndk at the NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Rust for Android
        run: bash scripts/build_rust.sh android
      - run: cd app/flutter && flutter pub get
      - run: cd app/flutter && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/flutter/build/app/outputs/flutter-apk/
          retention-days: 7

  # ── Build Web ───────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    needs: [prepare-pr-worktree, flutter-analyze]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd app/flutter && flutter pub get
      - run: cd app/flutter && flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: app/flutter/build/web/
          retention-days: 7

  # ── Playwright Web Tests ────────────────────────
  playwright-web:
    name: Playwright Web Tests
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    needs: [prepare-pr-worktree, build-web, build-server]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: web-release
          path: app/flutter/build/web/
      - uses: actions/download-artifact@v4
        with:
          name: server-linux
          path: ${{ runner.temp }}/server
      - name: Pick a free port
        run: echo "CRISPY_WEB_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
      - name: Serve web app
        run: npx -y http-server app/flutter/build/web -p "$CRISPY_WEB_PORT" -a 127.0.0.1 -c-1 --cors &
      - name: Wait for server
        run: npx -y wait-on "http://127.0.0.1:$CRISPY_WEB_PORT" --timeout 60000
      - name: Start backend server
        run: |
          chmod +x "$RUNNER_TEMP/server/crispy-server"
          CRISPY_PORT=8081 nohup "$RUNNER_TEMP/server/crispy-server" > "$RUNNER_TEMP/crispy-server.log" 2>&1 &
      - name: Wait for backend server
        run: npx -y wait-on http://127.0.0.1:8081/health --timeout 60000
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: cd testing/playwright && npm ci
      - name: Run Playwright tests
        run: cd testing/playwright && npx playwright test --workers=4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: testing/playwright/test-results/
          retention-days: 14

  # ── Build Server ────────────────────────────────
  build-server:
    name: Build Server
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    needs: [prepare-pr-worktree, rust-test]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux Rust build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          prefix-key: v2
      - name: Build server binary
        run: cargo build -p crispy-server --release
        working-directory: rust
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: rust/target/release/crispy-server
          retention-days: 7

  # =================================================================
  # === TIER 2: Advisory (non-blocking) =============================
  # =================================================================

  # ── Build Linux ─────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64","generic"]') || 'ubuntu-latest' }}
    needs: [prepare-pr-worktree, rust-test, flutter-analyze]
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          prefix-key: v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux deps
        run: |
          command -v apt-get >/dev/null || exit 0
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build \
            libgtk-3-dev libdbus-1-dev pkg-config \
            libmpv-dev
      - run: cd app/flutter && flutter pub get
      - run: cd app/flutter && flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: app/flutter/build/linux/x64/release/bundle/
          retention-days: 7

  # ── Build macOS ─────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [prepare-pr-worktree, rust-test, flutter-analyze]
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: >-
            x86_64-apple-darwin,
            aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          prefix-key: v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Rust for macOS
        run: bash scripts/build_rust.sh macos
      - run: cd app/flutter && flutter pub get
      - run: cd app/flutter && flutter build macos --release --obfuscate --split-debug-info=build/macos-symbols
      - name: Package macOS app
        run: |
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/crispy_tivi.app \
            build/macos-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos-release.zip
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dsyms
          path: build/macos/Build/Products/Release/**/*.dSYM
          retention-days: 7

  # ── Build iOS ───────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [prepare-pr-worktree, rust-test, flutter-analyze]
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Unpack prepared source
        run: tar -xzf "$RUNNER_TEMP/source/source.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          prefix-key: v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Rust for iOS
        run: bash scripts/build_rust.sh ios
      - run: cd app/flutter && flutter pub get
      - run: cd app/flutter && flutter build ios --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: app/flutter/build/ios/iphoneos/
          retention-days: 7
