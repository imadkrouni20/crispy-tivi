name: Build IPTV APK (Phone + TV)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Enable Android platform
        run: flutter config --enable-android

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android folder
        run: flutter create . --platforms=android --project-name crispy_tivi

      - name: Configure AndroidManifest (TV + Internet + HTTP)
        run: |
          python3 << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          
          block = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.type.television" android:required="false"/>
          '''
          if 'android.software.leanback' not in content:
              content = content.replace('<application', block + '    <application', 1)
          
          content = re.sub(
              r'<application(\s+)',
              r'<application\1android:usesCleartextTraffic="true"\1',
              content, count=1)
          
          with open(path, 'w') as f:
              f.write(content)
          print(content[:2000])
          PYEOF

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk
          path: release-apks/*.apk
          retention-days: 30
