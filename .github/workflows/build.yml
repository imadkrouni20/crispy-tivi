name: Build IPTV APK (Phone + TV)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Enable Android platform
        run: flutter config --enable-android

      # 🔑 الخطوة الأهم: أنشئ مجلد android قبل pub get
      - name: Generate Android folder
        run: flutter create . --platforms=android --project-name crispy_tivi --org com.crispy

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Gradle Setup (settings.gradle + build.gradle)
        run: |
          python3 << 'PYEOF'
          import os, re

          # ============ 1. settings.gradle ============
          # 🔑 استخدام النمط الحديث (pluginManagement + plugins)
          settings_path = "android/settings.gradle"
          modern_settings = '''pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.10" apply false
          }

          include ":app"
          '''
          with open(settings_path, "w") as f:
              f.write(modern_settings)
          print("✅ settings.gradle مُحدّث")

          # ============ 2. android/build.gradle ============
          root_build = "android/build.gradle"
          modern_root = '''allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          '''
          with open(root_build, "w") as f:
              f.write(modern_root)
          print("✅ android/build.gradle مُحدّث")

          # ============ 3. android/app/build.gradle ============
          app_build = "android/app/build.gradle"
          modern_app = '''plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader("UTF-8") { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
          def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

          android {
              namespace = "com.crispy.crispy_tivi"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.crispy.crispy_tivi"
                  minSdk = 21
                  targetSdk = 36
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
          }
          '''
          with open(app_build, "w") as f:
              f.write(modern_app)
          print("✅ android/app/build.gradle مُحدّث")

          # ============ 4. gradle.properties ============
          gp = "android/gradle.properties"
          with open(gp, "w") as f:
              f.write('''org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          android.defaults.buildfeatures.buildconfig=true
          ''')
          print("✅ gradle.properties مُحدّث")

          # ============ 5. gradle wrapper 8.7 ============
          gw = "android/gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(gw):
              with open(gw, "w") as f:
                  f.write('''distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip
          ''')
              print("✅ Gradle wrapper → 8.7")
          PYEOF

      - name: Configure AndroidManifest
        run: |
          python3 << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          block = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.type.television" android:required="false"/>
          '''
          if 'android.software.leanback' not in content:
              content = content.replace('<application', block + '    <application', 1)

          content = re.sub(
              r'<application(\s+)',
              r'<application\1android:usesCleartextTraffic="true"\1android:hardwareAccelerated="true"\1',
              content, count=1)

          with open(path, 'w') as f:
              f.write(content)
          print("✅ Manifest configured")
          PYEOF

      - name: Build APK
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk
          path: release-apks/*.apk
          retention-days: 30

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/settings.gradle
            android/build.gradle
            android/app/build.gradle
            android/gradle.properties
          retention-days: 7
