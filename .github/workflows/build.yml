name: Build IPTV APK (Phone + TV)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Enable Android platform
        run: flutter config --enable-android

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android folder if missing
        run: flutter create . --platforms=android --project-name crispy_tivi

      - name: Add TV support to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.type.television" android:required="false" />' "$MANIFEST"
            echo "✅ Manifest updated"
            cat "$MANIFEST" | head -20
          else
            echo "❌ Manifest not found!"
            exit 1
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-apk
          path: release-apks/*.apk
          retention-days: 30
