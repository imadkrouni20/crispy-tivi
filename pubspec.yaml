name: crispy_tivi
description: IPTV Player for Phone, Tablet and TV
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  http: ^1.2.1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  xml: ^6.5.0

# 🔑 الحل: تثبيت نسخ متوافقة مع Gradle القديم
dependency_overrides:
  package_info_plus: 8.1.4
  wakelock_plus: 1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
